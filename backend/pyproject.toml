[project]
name = "tethr-backend"
version = "1.0.0"
description = "Tethr Python FastAPI Backend & MCP Server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "beanie>=1.27.0,<2.0.0",
    "motor>=3.6.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
]

[tool.ruff]
# Target Python version
target-version = "py311"
line-length = 100
indent-width = 4

# Exclude generated / cache directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "logs",
]

[tool.ruff.lint]
# Enable standard rule groups:
# E: pycodestyle errors
# W: pycodestyle warnings
# F: Pyflakes
# I: isort (import sorting)
# UP: pyupgrade
# B: flake8-bugbear
# SIM: flake8-simplify
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# Ignore rules that conflict with modern FastAPI / Beanie idioms
ignore = [
    "E501",  # Line length handled by formatter
    "B008",  # Do not perform function calls in argument defaults (standard for FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
