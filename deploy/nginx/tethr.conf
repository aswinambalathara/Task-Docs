# Tethr reverse proxy: tethr. serves the public homepage and legal pages, app. the web app (both
# from the Next.js container, which picks pages by hostname), and api. the API and the MCP server
# (mounted on the API at /sse, /messages and /mcp). Install as /etc/nginx/sites-available/tethr.conf,
# symlinked into sites-enabled. Tethr's blocks only: the server-wide catch-all (default_server)
# lives in the server's own config, not here. Names used here are prefixed tethr_ / tethr- so they
# cannot clash with other sites; localhost ports 3000 and 8000 are Tethr's.
#
# The certificate must exist before Nginx will load this file (the server's catch-all answers
# the first challenge; afterwards the port-80 block below does):
#   sudo certbot certonly --webroot -w /var/www/html --cert-name tethr \
#     --deploy-hook "systemctl reload nginx" \
#     -d tethr.aswin-ambalathara.space -d app.tethr.aswin-ambalathara.space \
#     -d api.tethr.aswin-ambalathara.space
# certbot's timer renews it the same way, so certbot never edits this file.

upstream tethr_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream tethr_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Plain HTTP serves certificate renewal challenges and redirects everything else
server {
    listen 80;
    listen [::]:80;
    server_name tethr.aswin-ambalathara.space app.tethr.aswin-ambalathara.space
                api.tethr.aswin-ambalathara.space;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Public site: same container as the app; its proxy serves only /, /privacy and /terms here
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tethr.aswin-ambalathara.space;

    include snippets/tethr-tls.conf;

    location / {
        proxy_pass http://tethr_web;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.tethr.aswin-ambalathara.space;

    include snippets/tethr-tls.conf;

    location / {
        proxy_pass http://tethr_web;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tethr.aswin-ambalathara.space;

    include snippets/tethr-tls.conf;

    # MCP streams (SSE, its message channel, Streamable HTTP) must not be buffered
    location ~ ^/(sse|messages|mcp)(/|$) {
        proxy_pass http://tethr_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://tethr_api;
    }
}
