# Shared TLS and proxy settings for the Tethr server blocks.
# Install as /etc/nginx/snippets/tethr-tls.conf.

ssl_certificate /etc/letsencrypt/live/tethr/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/tethr/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:tethr_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

client_max_body_size 5m;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
