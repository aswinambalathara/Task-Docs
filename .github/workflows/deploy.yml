# Push to main: run CI, build the changed images for linux/arm64, push them to GHCR as
# sha-<commit>, then deploy that tag to the VM over SSH (deploy.sh rolls back if health checks fail).
#
# Run manually with no input to rebuild both images (e.g. after changing a NEXT_PUBLIC_* variable),
# or with a commit SHA to redeploy that already-built version without rebuilding (rollback).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA of a built version to redeploy (leave empty to rebuild main)
        required: false
        default: ""

permissions:
  contents: read

# Deploys queue instead of overlapping or cancelling each other
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ !inputs.commit && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ci.yml

  changes:
    if: ${{ !inputs.commit && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.diff.outputs.api }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Rebuild both on manual runs and when there is no previous commit to compare with
          if [[ "$EVENT" != push || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "api=true" >>"$GITHUB_OUTPUT"
            echo "web=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if grep -q '^backend/' <<<"$files"; then echo "api=true"; else echo "api=false"; fi >>"$GITHUB_OUTPUT"
          if grep -q '^frontend/' <<<"$files"; then echo "web=true"; else echo "web=false"; fi >>"$GITHUB_OUTPUT"

  build:
    needs: [ci, changes]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: backend
            build-args: ""
          - service: web
            context: frontend
            # Inlined into the browser bundle at build time; set as repository variables
            build-args: |
              BACKEND_URL=http://api:8000
              NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
              NEXT_PUBLIC_API_URL=/api/v1
              NEXT_PUBLIC_MCP_SSE_URL=${{ vars.NEXT_PUBLIC_MCP_SSE_URL }}
              NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    env:
      IMAGE: ghcr.io/aswinambalathara/tethr-${{ matrix.service }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An unchanged service gets the new tag on its last image (a manifest copy, no rebuild).
      # Falls back to building when there is no previous image yet.
      - id: reuse
        if: ${{ needs.changes.outputs[matrix.service] != 'true' }}
        run: |
          if docker buildx imagetools create -t "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:main"; then
            echo "done=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: ${{ steps.reuse.outputs.done != 'true' }}
      - uses: docker/build-push-action@v6
        if: ${{ steps.reuse.outputs.done != 'true' }}
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    needs: build
    # Runs after a successful build, or on its own for a manual redeploy of an existing commit
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' || (inputs.commit && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - id: version
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full 40-character SHA"; exit 1; }
          echo "commit=$COMMIT" >>"$GITHUB_OUTPUT"

      # The compose file deployed with an image comes from that image's own commit
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.commit }}
          sparse-checkout: deploy

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          TAG: sha-${{ steps.version.outputs.commit }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          # The key's forced command on the VM runs deploy.sh; the compose file goes over stdin
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@$HOST" "deploy tethr $TAG" <deploy/compose.prod.yaml

      - name: Check the public endpoint
        if: ${{ vars.HEALTH_URL != '' }}
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$HEALTH_URL"
